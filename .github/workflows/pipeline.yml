name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t dvwa-app .

    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: dvwa-app
        format: json
        output: trivy-report.json

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-report.json

    - name: Run Semgrep
      run: |
        pip install semgrep
        semgrep scan --json --output semgrep-report.json

    - name: Upload Semgrep report
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep-report.json

    - name: Run ZAP Scan
      run: |
       docker run -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://host.docker.internal:8080 \
          -J zap-report.json

    - name: Upload Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
           semgrep-report.json
           trivy-report.json
           zap-report.json

    - name: Send to n8n
      run: |
        curl -X POST https://unfitted-unsubtle-overdrive.ngrok-free.dev/webhook/security
