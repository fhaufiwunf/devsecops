name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Trivy FS Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        format: json
        output: trivy-report.json

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report
        path: trivy-report.json

    - name: Run Semgrep
      run: |
        pip install semgrep
        semgrep scan --config p/security-audit --config p/owasp-top-ten --json --output semgrep-report.json .

    - name: Upload Semgrep report
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: semgrep-report.json

    - name: Run ZAP Scan
      continue-on-error: true
      run: |
        docker run -t \
          -u root \
          -v $(pwd):/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t https://example.com \
          -J zap-report.json \
          -I || true

    - name: Upload Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
           semgrep-report.json
           trivy-report.json
           zap-report.json

    - name: Send to n8n
      run: |
        jq -n \
          --slurpfile trivy trivy-report.json \
          --slurpfile semgrep semgrep-report.json \
          --slurpfile zap zap-report.json \
          '{trivy: $trivy[0], semgrep: $semgrep[0], zap: $zap[0]}' > final-report.json

        curl -X POST https://unfitted-unsubtle-overdrive.ngrok-free.dev/webhook/security-scan  \
          -H "Content-Type: application/json" \
          -d @final-report.json

    - name: Check Security Gate
      run: |
        if [ "${{ steps.security_gate.outputs.decision }}" = "block" ]; then
          echo "Security gate failed"
          exit 1
        fi

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/dvwa-app:${{ github.sha }} .

    - name: Login to Docker Hub
      if: success()
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      if: success()
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/dvwa-app:${{ github.sha }}

    - name: Deploy to Kubernetes
      if: success()
      run: |
        kubectl set image deployment/dvwa-app dvwa-app=${{ secrets.DOCKERHUB_USERNAME }}/dvwa-app:${{ github.sha }}
        kubectl rollout status deployment/dvwa-app
